services:
  db:
    image: postgres:16
    container_name: airport_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airport
      POSTGRES_USER: airport_user
      POSTGRES_PASSWORD: airport_pass
    ports:
      - "5432:5432"
    volumes:
      - airport_pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: airport_backend
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "change-me-to-a-random-string"
      DB_NAME: airport
      DB_USER: airport_user
      DB_PASSWORD: airport_pass
      DB_HOST: db
      DB_PORT: "5432"

  frontend:
    build: ../airport-frontend
    container_name: airport_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  airport_pgdata: